name: Validate Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          python3 scripts/validate-package.py

      - name: Validate reindex.sh runs
        run: |
          chmod +x hooks/reindex.sh
          CLAUDE_PROJECT_ROOT=. bash hooks/reindex.sh
          test -f CODE_INDEX.md || (echo "reindex.sh did not create CODE_INDEX.md" && exit 1)
          echo "reindex.sh OK."
          cat CODE_INDEX.md
